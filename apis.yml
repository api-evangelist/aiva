aid: aiva
name: Aiva
description: AIVA (Artificial Intelligence Virtual Artist) is an AI music generation
  platform that composes original music across more than 250 styles in seconds. Musicians,
  content creators, and studios generate tracks from prompts or from uploaded audio
  and MIDI influences, build custom style models, edit the resulting compositions,
  and export to MP3, MIDI, and WAV. Paid plans add higher download limits, longer
  tracks, social monetization rights, and full copyright ownership. AIVA is a consumer-
  and creator-facing product; as of this enrichment pass it publishes no public developer
  API, SDKs, or /.well-known discovery documents.
